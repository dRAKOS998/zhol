# Render Blueprint for the Zhol game server (one long-running Node.js process + persistent disk).
# The frontend is deployed separately on Vercel (see README).
services:
  - type: web
    name: zhol-server
    runtime: node
    plan: starter # persistent disks require a paid instance
    region: frankfurt
    buildCommand: npm ci && npm run build -w @zhol/server
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/zhol.db
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://zhol.vercel.app
      - key: PUBLIC_WEB_URL
        sync: false # e.g. https://zhol.vercel.app
    disk:
      name: zhol-data
      mountPath: /var/data
      sizeGB: 1
